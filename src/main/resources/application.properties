# Database Configuration with tutul ownership
spring.datasource.url=jdbc:postgresql://localhost:5432/qarz_mukti
spring.datasource.username=tutul
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# JWT Configuration
jwt.secret=dev-only-secret-key-change-me-0123456789abcdef
jwt.expiration=86400000
# Token expiration: 86400000ms = 24 hours