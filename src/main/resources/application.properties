spring.application.name=QarzMukti
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------------
# Database — all values can be overridden via environment variables.
# See .env.example and docker-compose.yml for local setup.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qarz_mukti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ---------------------------------------------------------------------------
# JWT — JWT_SECRET MUST be set to a long random value in production
# (minimum 32 characters for HS256). The default below is for local dev only.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
# Token expiration: 86400000ms = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}
